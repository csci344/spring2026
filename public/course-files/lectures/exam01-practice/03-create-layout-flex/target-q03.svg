<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Flexbox layout target">
  <rect x="0" y="0" width="900" height="520" fill="#0b1220"/>

  <!-- header -->
  <rect x="30" y="24" width="840" height="80" rx="12" fill="#111827" stroke="#334155"/>
  <rect x="54" y="46" width="140" height="36" rx="10" fill="#1f2937" stroke="#475569"/>
  <text x="80" y="70" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#e5e7eb">logo</text>

  <rect x="610" y="46" width="70" height="36" rx="10" fill="#1f2937" stroke="#475569"/>
  <rect x="690" y="46" width="70" height="36" rx="10" fill="#1f2937" stroke="#475569"/>
  <rect x="770" y="46" width="70" height="36" rx="10" fill="#1f2937" stroke="#475569"/>
  <text x="624" y="70" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#e5e7eb">nav</text>
  <text x="704" y="70" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#e5e7eb">nav</text>
  <text x="784" y="70" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#e5e7eb">nav</text>

  <!-- main -->
  <rect x="30" y="124" width="840" height="372" rx="12" fill="#111827" stroke="#334155"/>

  <!-- sidebar -->
  <rect x="54" y="148" width="210" height="324" rx="12" fill="#0f172a" stroke="#475569"/>
  <text x="110" y="178" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#e5e7eb">sidebar</text>

  <!-- content -->
  <rect x="288" y="148" width="558" height="324" rx="12" fill="#0f172a" stroke="#475569"/>
  <text x="520" y="178" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#e5e7eb">content</text>

  <!-- cards -->
  <rect x="312" y="210" width="160" height="120" rx="12" fill="#111827" stroke="#475569"/>
  <rect x="488" y="210" width="160" height="120" rx="12" fill="#111827" stroke="#475569"/>
  <rect x="664" y="210" width="160" height="120" rx="12" fill="#111827" stroke="#475569"/>
  <text x="372" y="275" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#e5e7eb">card</text>
  <text x="548" y="275" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#e5e7eb">card</text>
  <text x="724" y="275" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#e5e7eb">card</text>

  <!-- note -->
  <text x="30" y="512" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#94a3b8">
    Target: header uses flex (logo left, nav right). Main uses flex (sidebar + content). Cards are a flex row with gap.
  </text>
</svg>

