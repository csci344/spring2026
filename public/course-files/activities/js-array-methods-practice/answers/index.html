<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Array Methods Practice - Todo List (Answers)</title>
  <link rel="stylesheet" href="../styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>Todo List with Array Methods</h1>
    <div class="stats">
      <p>Total: <span id="totalCount">0</span></p>
      <p>Completed: <span id="completedCount">0</span></p>
      <p>Active: <span id="activeCount">0</span></p>
    </div>
    <div class="filters">
      <button id="filterAll" class="filter-btn active">All</button>
      <button id="filterActive" class="filter-btn">Active</button>
      <button id="filterCompleted" class="filter-btn">Completed</button>
    </div>
    <ul id="todoList"></ul>
  </div>
</body>
</html>
