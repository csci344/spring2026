<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="Grid layout target">
  <rect x="0" y="0" width="900" height="520" fill="#0b1220"/>

  <!-- outer -->
  <rect x="30" y="24" width="840" height="472" rx="12" fill="#111827" stroke="#334155"/>

  <!-- header -->
  <rect x="54" y="48" width="792" height="70" rx="12" fill="#0f172a" stroke="#475569"/>
  <text x="78" y="92" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#e5e7eb">header</text>

  <!-- middle row: nav / main / aside -->
  <rect x="54" y="138" width="170" height="258" rx="12" fill="#0f172a" stroke="#475569"/>
  <text x="110" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#e5e7eb">nav</text>

  <rect x="244" y="138" width="412" height="258" rx="12" fill="#0f172a" stroke="#475569"/>
  <text x="428" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#e5e7eb">main</text>

  <rect x="676" y="138" width="170" height="258" rx="12" fill="#0f172a" stroke="#475569"/>
  <text x="725" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#e5e7eb">aside</text>

  <!-- footer -->
  <rect x="54" y="416" width="792" height="70" rx="12" fill="#0f172a" stroke="#475569"/>
  <text x="78" y="460" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#e5e7eb">footer</text>

  <text x="30" y="512" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12" fill="#94a3b8">
    Target: 3-column grid in the middle row; header/footer span all columns; consistent gap.
  </text>
</svg>

